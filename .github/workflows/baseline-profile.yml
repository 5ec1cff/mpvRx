name: Capture Baseline Profiles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture startup and library profiles
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedStandardDebugAndroidTest -PtargetAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=app.gyrolet.mpvrx.presentation.components.RemoteImageLoaderTest --no-daemon --max-workers=2 --stacktrace
            ./gradlew :app:generateStandardReleaseBaselineProfile -PtargetAbi=x86_64 --no-daemon --max-workers=2 --stacktrace
      - name: Upload profiles for review and committing
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profiles-${{ github.sha }}
          path: app/src/standardRelease/generated/baselineProfiles/*.txt
          if-no-files-found: error
      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-capture-diagnostics-${{ github.sha }}
          path: |
            baselineprofile/build/reports/androidTests/
            baselineprofile/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
